<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#030807">
<title>Rox Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030706; --g1:#10b981; --g3:#34d399; --b1:#12a574; --b2:#0d8f64; --rgb:16,185,129;
  --o1:#c8fff3; --o2:#3fe0c8; --o3:#12b88f; --o4:#08755a; --o5:#032a21;
  --txt:#eef6f3; --mut:#8fa69d; --bd:rgba(255,255,255,.13); --glass:rgba(255,255,255,.055);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:"Plus Jakarta Sans",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden}
.glow{position:absolute;inset:0;pointer-events:none;transition:background .6s;background:linear-gradient(rgba(var(--rgb),.13),transparent 55%),radial-gradient(70% 42% at 50% 38%,rgba(var(--rgb),.30),transparent 72%),radial-gradient(90% 40% at 50% 100%,rgba(var(--rgb),.08),transparent 70%)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center}
.screen.on{display:flex;animation:fade .5s}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ORB */
.orb{position:relative;border-radius:50%;flex:none;
  background:radial-gradient(circle at 34% 26%,var(--o1) 0,var(--o2) 10%,var(--o3) 34%,var(--o4) 66%,var(--o5) 100%);
  box-shadow:0 0 90px rgba(var(--rgb),.42),inset -14px -20px 44px rgba(0,0,0,.5),inset 6px 6px 26px rgba(255,255,255,.12);
  border:1.5px solid rgba(255,255,255,.2)}
.orb::before{content:"";position:absolute;left:19%;top:12%;width:17%;height:8%;border-radius:50%;background:rgba(255,255,255,.9);filter:blur(1.2px);transform:rotate(-32deg)}
.orb::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.28),transparent 42%)}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.pill{padding:6px 15px;border-radius:12px;border:1px solid var(--bd);background:var(--glass);font-size:12px;letter-spacing:.14em}

/* SPLASH */
#splash .orb{width:112px;height:112px;margin-top:33vh;animation:breathe 3s infinite}
#splash .pill{margin-top:30px}
#splash .sub{margin-top:10px;color:var(--mut);font-size:14px}

/* ONBOARD */
.ob-body{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 24px;text-align:center;overflow:hidden}
.ob1 .orb{width:min(54vw,230px);height:min(54vw,230px);margin-bottom:34px}
.ob1 h1{font-size:34px;font-weight:700}
.ob1 h1 span,.ob2 h1 span,.ob3 h1 span{color:var(--g3)}
.ob1 p{color:var(--mut);margin-top:10px;font-size:15px}
.ob2{align-items:flex-start;justify-content:flex-start;text-align:left;padding-top:26px}
.ob2 .orb{width:60px;height:60px;margin-bottom:18px}
.ob2 h1{font-size:32px;font-weight:700;margin-bottom:18px}
.cards{display:grid;gap:11px;width:100%}
.card{display:flex;gap:14px;align-items:center;padding:13px 14px;border-radius:20px;border:1px solid var(--bd);background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.03));backdrop-filter:blur(10px)}
.card .ic{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid rgba(var(--rgb),.35);background:rgba(var(--rgb),.1);display:grid;place-items:center}
.card b{display:block;font-size:16px;font-weight:600}
.card span{display:block;font-size:13px;color:var(--mut);margin-top:3px;line-height:1.35}
.ob3 .shield{width:58px;height:58px;border-radius:16px;border:1px solid rgba(var(--rgb),.4);background:rgba(var(--rgb),.1);display:grid;place-items:center;margin-bottom:16px}
.ob3 h1{font-size:30px;font-weight:800}
.checks{margin-top:22px;width:100%;border:1px solid var(--bd);border-radius:20px;background:rgba(255,255,255,.05);backdrop-filter:blur(14px);overflow:hidden;text-align:left}
.checks div{display:flex;gap:12px;align-items:center;padding:12px 14px;font-size:14px;line-height:1.35;border-bottom:1px solid rgba(255,255,255,.07)}
.checks div:last-child{border:0}
.chk{flex:none;width:22px;height:22px;border-radius:7px;border:1px solid rgba(var(--rgb),.5);background:rgba(var(--rgb),.14);display:grid;place-items:center}
.small{margin-top:14px;font-size:12px;color:var(--mut)}
.ob-foot{width:100%;padding:0 22px 24px}
.dots{display:flex;gap:9px;justify-content:center;margin-bottom:18px}
.dots i{width:8px;height:8px;border-radius:8px;background:rgba(255,255,255,.2);transition:.3s}
.dots i.on{width:26px;background:var(--g1)}
.btn-main{width:100%;padding:16px;border-radius:16px;background:linear-gradient(var(--b1),var(--b2));font-weight:600;font-size:17px;box-shadow:0 8px 30px rgba(var(--rgb),.3);border:1px solid rgba(255,255,255,.14)}

/* MAIN */
.top{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;position:relative;z-index:5}
.cbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--glass);display:grid;place-items:center;overflow:hidden}
.cbtn img{width:100%;height:100%;object-fit:cover}
.rt{display:flex;gap:10px}
.cbtn.cut{display:none;background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.55);color:#fca5a5}
.cbtn.cut.show{display:grid}
.cbtn.cut.active{background:rgba(239,68,68,.88);color:#fff;animation:pulseR 1.6s infinite}
@keyframes pulseR{0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}100%{box-shadow:0 0 0 14px rgba(239,68,68,0)}}
.toast{position:absolute;left:14px;right:14px;top:66px;z-index:60;display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:16px;border:1px solid var(--bd);background:rgba(24,38,34,.88);backdrop-filter:blur(16px);transform:translateY(-20px);opacity:0;pointer-events:none;transition:.35s}
.toast.show{transform:none;opacity:1}
.toast .ti{width:34px;height:34px;border-radius:10px;background:rgba(56,189,248,.13);display:grid;place-items:center;flex:none}
.toast small{display:block;color:var(--mut);font-size:12px}
.toast b{font-size:14px;font-weight:600;line-height:1.3}
.stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
#orb{width:min(58vw,270px);height:min(58vw,270px);transition:transform .08s linear}
#orb.idle{animation:breathe 4s infinite}
.bottom{width:100%;height:215px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:30px}
.sline{position:relative;width:100%;height:46px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.wave{position:absolute;left:0;top:0;width:100%;height:100%}
.status{position:relative;z-index:2;font-size:14px;color:#d4e6df;padding:0 10px;background:transparent}
.mic-row{display:flex;align-items:center;justify-content:center;gap:30px;height:92px;z-index:2}
.mic{position:relative;width:58px;height:58px;border-radius:50%;border:1px solid var(--bd);background:rgba(255,255,255,.06);display:grid;place-items:center;transition:all .3s}
.mic.live{width:76px;height:76px;background:rgba(var(--rgb),.22);border-color:rgba(var(--rgb),.5);box-shadow:0 0 0 13px rgba(var(--rgb),.1),0 0 0 28px rgba(var(--rgb),.055)}
.mic.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.side{width:46px;height:46px;border-radius:50%;border:1px solid var(--bd);background:var(--glass);display:none;place-items:center}
.side.on{background:rgba(var(--rgb),.28);border-color:rgba(var(--rgb),.6)}
.live-on .side{display:grid}
.dot-live{position:absolute;right:16px;top:16px;width:8px;height:8px;border-radius:50%;background:#22c55e;display:none;z-index:7;box-shadow:0 0 8px #22c55e}
.live-on .dot-live{display:block}
.menu{position:absolute;right:14px;top:60px;z-index:20;min-width:220px;border-radius:16px;border:1px solid var(--bd);background:rgba(18,30,26,.96);backdrop-filter:blur(18px);padding:6px;display:none}
.menu.show{display:block}
.menu button{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:10px;font-size:14px}
.menu button:active{background:rgba(255,255,255,.08)}

/* VIDEO CALL */
#vc{position:absolute;inset:0;z-index:40;background:#000;display:none;flex-direction:column}
#vc.show{display:flex}
#vcVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#050a08}
#vc .shade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.55),transparent 22%,transparent 48%,rgba(0,0,0,.88));pointer-events:none}
.vtop{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 16px 0}
.vtag{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:30px;background:rgba(0,0,0,.45);border:1px solid var(--bd);backdrop-filter:blur(10px);font-size:13px}
.vtag .orb{width:30px;height:30px;box-shadow:0 0 14px rgba(var(--rgb),.6)}
.vtag .orb::before{display:none}
.vtime{margin-left:6px;color:#cfe4dc;font-variant-numeric:tabular-nums}
.vcap{position:relative;z-index:2;margin-top:auto;padding:0 18px 12px;text-align:center}
#capU{font-size:13px;color:#b9cbc4;min-height:18px;margin-bottom:6px;text-shadow:0 1px 6px #000}
#capR{font-size:19px;font-weight:600;line-height:1.35;min-height:52px;text-shadow:0 2px 10px #000;max-height:130px;overflow:hidden}
#capR em{font-style:normal;color:var(--g3);font-size:12px;display:block;letter-spacing:.1em;margin-bottom:3px}
.vctl{position:relative;z-index:2;display:flex;justify-content:center;align-items:center;gap:26px;padding:6px 0 calc(env(safe-area-inset-bottom) + 26px)}
.vbtn{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid var(--bd);backdrop-filter:blur(10px);display:grid;place-items:center}
.vbtn.on{background:rgba(255,255,255,.9);color:#000}
.vbtn.end{width:68px;height:68px;background:#ef4444;border-color:#f87171}
.vwave{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 108px);height:2px;z-index:2;background:linear-gradient(90deg,transparent,rgba(var(--rgb),.9),transparent);opacity:0;transition:opacity .3s}
.vwave.talk{opacity:1;animation:vw .5s infinite alternate}
@keyframes vw{from{transform:scaleY(1)}to{transform:scaleY(5)}}

/* SHEETS */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:70;display:none;backdrop-filter:blur(6px)}
.scrim.show{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:94%;overflow-y:auto;z-index:71;border-radius:28px 28px 0 0;border:1px solid var(--bd);background:linear-gradient(#142420,#0a1411);padding:22px 18px 20px;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.2,1);user-select:text;-webkit-user-select:text}
.sheet.show{transform:none}
.avatar{width:80px;height:80px;border-radius:50%;margin:0 auto;border:1px solid var(--bd);background:rgba(var(--rgb),.16);display:grid;place-items:center;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.cap{text-align:center;color:var(--mut);font-size:12px;margin:8px 0 14px}
.row{display:flex;gap:12px}.row>div{flex:1}
label{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;margin:14px 0 7px}
label em{font-style:normal;font-weight:400;color:var(--mut);font-size:11px;font-family:"JetBrains Mono",monospace}
input,textarea,select{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--bd);background:rgba(255,255,255,.05);color:var(--txt);font-family:inherit;font-size:14px;outline:none}
input:focus,textarea:focus{border-color:rgba(var(--rgb),.6)}
textarea{height:96px;resize:none}
.seg{display:flex;padding:3px;border-radius:12px;border:1px solid var(--bd);background:rgba(255,255,255,.04)}
.seg button{flex:1;padding:10px;border-radius:9px;font-size:14px;color:var(--mut)}
.seg button.on{background:rgba(255,255,255,.14);color:var(--txt);font-weight:600}
.keywrap{position:relative}
.keywrap button{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--mut);font-family:"JetBrains Mono",monospace}
.hint{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:7px}
.hint a{color:var(--mut)}
.okbar{margin-top:14px;padding:12px;border-radius:12px;border:1px solid rgba(var(--rgb),.4);background:rgba(var(--rgb),.12);color:var(--g3);font-size:13px;display:none}
.okbar.show{display:block}.okbar.err{border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.12);color:#fca5a5}
.savebar{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:13px;color:var(--mut)}
.save{padding:11px 22px;border-radius:12px;background:var(--g1);color:#03130d;font-weight:700;font-size:14px}
.creator{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:16px;border:1px solid var(--bd);background:var(--glass);font-size:13px}
.creator button{padding:9px 14px;border-radius:12px;border:1px solid var(--bd);background:rgba(255,255,255,.08);font-size:13px}
.memlist{display:none;margin-top:8px;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:rgba(255,255,255,.04);font-size:13px;color:#cfe4dc;line-height:1.55}
.memlist.show{display:block}
.adv{margin-top:14px;font-size:12px;color:var(--mut);text-align:center}
.pal{position:absolute;left:0;right:0;bottom:0;z-index:71;border-radius:28px 28px 0 0;border:1px solid var(--bd);background:linear-gradient(#142420,#0a1411);padding:22px 18px 30px;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.2,1)}
.pal.show{transform:none}
.pal h3{font-size:16px;margin-bottom:16px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px 8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;color:var(--mut);text-align:center}
.sw i{width:46px;height:46px;border-radius:50%;border:2px solid transparent;box-shadow:inset -6px -8px 14px rgba(0,0,0,.4),inset 4px 4px 10px rgba(255,255,255,.35)}
.sw.on i{border-color:#fff}.sw.on{color:#fff}

.menu{max-height:70vh;overflow-y:auto}
.panel{position:absolute;inset:0;z-index:72;background:rgba(3,8,6,.98);display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.panel.show{display:flex;animation:fade .25s}
.phead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;font-size:18px;font-weight:700;border-bottom:1px solid var(--bd)}
.phead button{width:36px;height:36px;border-radius:50%;border:1px solid var(--bd);background:var(--glass);font-size:18px}
.plist{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;user-select:text;-webkit-user-select:text}
.bub{max-width:84%;padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.bub.u{align-self:flex-end;background:rgba(var(--rgb),.22);border:1px solid rgba(var(--rgb),.4);border-bottom-right-radius:6px}
.bub.r{align-self:flex-start;background:var(--glass);border:1px solid var(--bd);border-bottom-left-radius:6px}
.bub img{max-width:200px;border-radius:12px;display:block}
.pin{display:flex;gap:8px;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--bd);align-items:center}
.pin input{flex:1}
.pin button{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--bd);background:var(--glass);display:grid;place-items:center}
.pin button.go{background:var(--g1);color:#03130d;border-color:transparent}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--glass);font-size:14px;line-height:1.4}
.note span{flex:1}.note small{display:block;color:var(--mut);font-size:11px;margin-top:3px}
.note button{color:#fca5a5;font-size:18px;padding:0 4px}
.empty{color:var(--mut);text-align:center;margin-top:40px;font-size:14px}
.tg{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;font-size:13px}
.tg small{display:block;color:var(--mut);font-size:11px;margin-top:2px;font-weight:400}
.tg input[type=checkbox]{appearance:none;-webkit-appearance:none;width:46px;height:27px;flex:none;border-radius:20px;background:rgba(255,255,255,.14);position:relative;padding:0;border:0;transition:.2s}
.tg input[type=checkbox]::after{content:"";position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.tg input[type=checkbox]:checked{background:var(--g1)}
.tg input[type=checkbox]:checked::after{left:22px}
input[type=range]{padding:0;height:28px;accent-color:var(--g1)}
.bkbtns{display:flex;gap:8px;margin-top:8px}
.bkbtns button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--glass);font-size:13px}
#orb{cursor:pointer}

#lock{position:fixed;inset:0;z-index:300;background:radial-gradient(70% 45% at 50% 30%,rgba(var(--rgb),.28),transparent 72%),#030706;display:none;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 8vh) 24px 24px}
#lock.show{display:flex}
#lock .orb{width:84px;height:84px;margin-bottom:22px;animation:breathe 3s infinite}
#lock h2{font-size:20px;font-weight:700;margin-bottom:18px;text-align:center}
.pdots{display:flex;gap:16px;margin-bottom:10px}
.pdots i{width:15px;height:15px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);transition:.15s}
.pdots i.on{background:var(--g3);border-color:var(--g3);box-shadow:0 0 10px rgba(var(--rgb),.7)}
.pdots.shake{animation:shk .35s}
@keyframes shk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.lockm{height:20px;font-size:13px;color:#fca5a5;margin-bottom:12px}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px;margin-top:auto;margin-bottom:6vh}
.keys button{width:76px;height:76px;border-radius:50%;border:1px solid var(--bd);background:var(--glass);font-size:26px;font-weight:500}
.keys button:active{background:rgba(var(--rgb),.3)}
.keys button.ghost{border:0;background:none}
#lockCancel{margin-bottom:10px;color:var(--mut);font-size:14px;padding:8px 18px}
.lkbtns{display:flex;gap:8px;margin-top:8px}
.lkbtns button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--glass);font-size:13px}
.mem-x{color:#fca5a5;padding:0 8px;cursor:pointer}

@keyframes e-bounce{from{translate:0 0}to{translate:0 -9px}}
@keyframes e-shake{0%{translate:-2px 0}100%{translate:2px 0}}
@keyframes e-pop{0%{scale:1}40%{scale:1.13}100%{scale:1}}
@keyframes e-sad{0%,100%{translate:0 0}50%{translate:0 5px}}
.orb.emo-happy{filter:brightness(1.18) saturate(1.35);animation:e-bounce .45s infinite alternate ease-in-out}
.orb.emo-sad{filter:saturate(.5) brightness(.75) hue-rotate(28deg);animation:e-sad 3s infinite ease-in-out}
.orb.emo-angry{filter:sepia(1) hue-rotate(-48deg) saturate(3.2);animation:e-shake .1s infinite alternate}
.orb.emo-surprise{filter:brightness(1.3) saturate(1.2);animation:e-pop .6s}

/* ---- video-2 features ---- */
.menu{left:14px;right:14px;min-width:0;top:62px;max-height:78vh;overflow-y:auto;border-radius:26px;padding:8px 8px 6px;background:linear-gradient(rgba(var(--rgb),.10),rgba(255,255,255,.03)),rgba(20,18,18,.72);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.crow{display:flex;align-items:center;gap:12px;padding:14px 14px;font-size:16px;font-weight:600;border-bottom:1px solid var(--bd);margin-bottom:6px}
.crow b{flex:1;font-weight:600}
.crow .cdot{width:14px;height:14px;border-radius:50%;background:var(--g
